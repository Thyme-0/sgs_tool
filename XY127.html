<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>五靈獸 · 相生相克</title>
    <style>
        /* ─── 全域重設 ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Times New Roman', serif;
            background: #0b0a0a;
            background-image: radial-gradient(ellipse at 50% 0%, #1f1a16 0%, #0b0a0a 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            max-width: 780px;
            width: 100%;
            background: rgba(20, 17, 14, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid #5a4a3a;
            border-radius: 48px 48px 32px 32px;
            padding: 30px 30px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px #3d322a inset;
            transition: all 0.2s;
        }

        /* ─── 標題列 ─── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 6px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #e8d5b8;
            letter-spacing: 6px;
            text-shadow: 0 0 12px #b8864b55;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 300;
            color: #9a8b7a;
            letter-spacing: 2px;
            margin-left: 10px;
        }

        .btn-round {
            background: #2f241b;
            border: 1px solid #7a624a;
            color: #f0e0c8;
            font-size: 18px;
            font-weight: 500;
            padding: 10px 28px;
            border-radius: 60px;
            cursor: pointer;
            letter-spacing: 4px;
            transition: 0.25s;
            box-shadow: 0 4px 0 #1a130e;
            font-family: inherit;
        }
        .btn-round:hover {
            background: #4d3828;
            border-color: #b8956a;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1a130e;
        }
        .btn-round:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1a130e;
        }
        .btn-round:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #1a130e;
        }

        /* ─── 狀態訊息 ─── */
        .status-bar {
            text-align: center;
            font-size: 15px;
            color: #b8a690;
            padding: 6px 0 14px 0;
            letter-spacing: 1px;
            border-bottom: 1px solid #2f241b;
            margin-bottom: 22px;
            min-height: 44px;
        }
        .status-bar .highlight {
            color: #f5d9a8;
            font-weight: 600;
        }

        /* ─── 五靈獸網格 ─── */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 14px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto 28px auto;
            aspect-ratio: 1/1;
        }

        /* 每個角色卡片 */
        .char-card {
            position: relative;
            border-radius: 24px;
            background: #1e1712;
            border: 2px solid #3d322a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 6px 0 #0f0b08;
            padding: 6px;
            min-height: 90px;
            user-select: none;
        }

        .char-card .img-wrap {
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 110px;
            border-radius: 16px;
            overflow: hidden;
            background: #0f0b08;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #3d322a;
        }
        .char-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .char-card .char-label {
            margin-top: 6px;
            font-size: 18px;
            font-weight: 600;
            color: #e8d5b8;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00000066;
        }
        .char-card .char-sub {
            font-size: 12px;
            color: #9a8b7a;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* 定位 */
        .char-card.pos-朱雀 {
            grid-column: 2;
            grid-row: 1;
        }
        .char-card.pos-青龍 {
            grid-column: 1;
            grid-row: 2;
        }
        .char-card.pos-祖龍 {
            grid-column: 2;
            grid-row: 2;
        }
        .char-card.pos-白虎 {
            grid-column: 3;
            grid-row: 2;
        }
        .char-card.pos-玄武 {
            grid-column: 2;
            grid-row: 3;
        }

        /* 各角色主題色（邊框／光暈） */
        .char-card[data-char="祖龍"] {
            border-color: #b8864b;
        }
        .char-card[data-char="祖龍"] .img-wrap {
            border-color: #b8864b;
        }
        .char-card[data-char="青龍"] {
            border-color: #3fa87a;
        }
        .char-card[data-char="青龍"] .img-wrap {
            border-color: #3fa87a;
        }
        .char-card[data-char="白虎"] {
            border-color: #c8c0b8;
        }
        .char-card[data-char="白虎"] .img-wrap {
            border-color: #c8c0b8;
        }
        .char-card[data-char="朱雀"] {
            border-color: #d44a4a;
        }
        .char-card[data-char="朱雀"] .img-wrap {
            border-color: #d44a4a;
        }
        .char-card[data-char="玄武"] {
            border-color: #4a6a8a;
        }
        .char-card[data-char="玄武"] .img-wrap {
            border-color: #4a6a8a;
        }

        /* 選中狀態 */
        .char-card.selected {
            border-color: #f5d9a8 !important;
            box-shadow: 0 0 24px #f5d9a855, 0 6px 0 #0f0b08;
            transform: translateY(-4px);
        }
        .char-card.selected .img-wrap {
            border-color: #f5d9a8 !important;
        }
        .char-card.selected .char-label {
            color: #f5d9a8;
        }

        /* 變暗（未選中） */
        .char-card.dimmed {
            opacity: 0.3;
            filter: grayscale(0.8);
            pointer-events: none;
            cursor: default;
            transform: scale(0.96);
        }

        /* 可點擊 hover (僅對選中的卡片) */
        .char-card.selected:hover {
            border-color: #f5d9a8 !important;
            transform: translateY(-6px);
            box-shadow: 0 10px 0 #0f0b08, 0 0 30px #f5d9a866;
        }

        /* ─── 資訊面板 ─── */
        .info-panel {
            background: #16110e;
            border: 1px solid #3d322a;
            border-radius: 24px;
            padding: 22px 26px;
            min-height: 130px;
            transition: 0.3s;
            box-shadow: 0 4px 0 #0a0806 inset;
            margin-top: 4px;
        }
        .info-panel .empty-msg {
            color: #6a5f52;
            font-size: 16px;
            letter-spacing: 2px;
            text-align: center;
            padding: 18px 0;
        }
        .info-panel .char-name {
            font-size: 28px;
            font-weight: 700;
            color: #f5d9a8;
            letter-spacing: 4px;
        }
        .info-panel .char-element {
            font-size: 18px;
            color: #c8b8a0;
            margin-left: 14px;
            font-weight: 400;
        }
        .info-panel .skill-name {
            font-size: 20px;
            font-weight: 600;
            color: #e0cdb0;
            margin-top: 8px;
            letter-spacing: 2px;
            border-top: 1px solid #2f241b;
            padding-top: 10px;
        }
        .info-panel .skill-desc {
            font-size: 16px;
            color: #c8b8a0;
            line-height: 1.7;
            margin-top: 6px;
            padding-left: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .info-panel .skill-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 40px;
            background: #2f241b;
            color: #b8956a;
            border: 1px solid #5a4a3a;
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .info-panel .skill-tag.shengsheng {
            color: #7acf9a;
            border-color: #3fa87a;
            background: #1a2f24;
        }
        .info-panel .skill-tag.xiangke {
            color: #e88060;
            border-color: #c84a4a;
            background: #2f1a1a;
        }

        /* ─── 響應式 ─── */
        @media (max-width: 600px) {
            .app {
                padding: 16px 14px 28px;
                border-radius: 28px;
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }
            .header h1 {
                font-size: 18px;
                letter-spacing: 3px;
            }
            .header h1 small {
                font-size: 12px;
                display: block;
                margin-left: 0;
            }
            .btn-round {
                font-size: 15px;
                padding: 8px 18px;
            }
            .grid {
                gap: 10px;
                max-width: 380px;
            }
            .char-card .char-label {
                font-size: 14px;
            }
            .char-card .char-sub {
                font-size: 10px;
            }
            .char-card .img-wrap {
                max-width: 70px;
            }
            .info-panel {
                padding: 16px 18px;
                min-height: 100px;
            }
            .info-panel .char-name {
                font-size: 22px;
            }
            .info-panel .skill-name {
                font-size: 17px;
            }
            .info-panel .skill-desc {
                font-size: 14px;
            }
            .status-bar {
                font-size: 13px;
            }
        }

        @media (max-width: 420px) {
            .grid {
                gap: 6px;
                max-width: 300px;
            }
            .char-card {
                border-radius: 16px;
                padding: 4px;
            }
            .char-card .img-wrap {
                max-width: 52px;
                border-radius: 10px;
            }
            .char-card .char-label {
                font-size: 12px;
                margin-top: 3px;
            }
            .char-card .char-sub {
                font-size: 9px;
            }
            .info-panel .skill-desc {
                font-size: 13px;
            }
            .btn-round {
                font-size: 13px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- 標題 + 按鈕 -->
        <div class="header">
            <h1>五靈獸 <small>相生 · 相克</small></h1>
            <button class="btn-round" id="btnNewRound">✦ 進入新回合</button>
        </div>

        <!-- 狀態列 -->
        <div class="status-bar" id="statusBar">
            ✦ 點擊 <span class="highlight">「進入新回合」</span> 隨機選取兩位靈獸
        </div>

        <!-- 五靈獸網格 -->
        <div class="grid" id="gridContainer">
            <!-- 朱雀 (上) -->
            <div class="char-card pos-朱雀" data-char="朱雀" data-element="火">
                <div class="img-wrap">
                    <img id="img-朱雀" src="" alt="朱雀" />
                </div>
                <div class="char-label">朱雀</div>
                <div class="char-sub">屬火</div>
            </div>

            <!-- 青龍 (左) -->
            <div class="char-card pos-青龍" data-char="青龍" data-element="木">
                <div class="img-wrap">
                    <img id="img-青龍" src="" alt="青龍" />
                </div>
                <div class="char-label">青龍</div>
                <div class="char-sub">屬木</div>
            </div>

            <!-- 祖龍 (中) -->
            <div class="char-card pos-祖龍" data-char="祖龍" data-element="土">
                <div class="img-wrap">
                    <img id="img-祖龍" src="" alt="祖龍" />
                </div>
                <div class="char-label">祖龍</div>
                <div class="char-sub">屬土</div>
            </div>

            <!-- 白虎 (右) -->
            <div class="char-card pos-白虎" data-char="白虎" data-element="金">
                <div class="img-wrap">
                    <img id="img-白虎" src="" alt="白虎" />
                </div>
                <div class="char-label">白虎</div>
                <div class="char-sub">屬金</div>
            </div>

            <!-- 玄武 (下) -->
            <div class="char-card pos-玄武" data-char="玄武" data-element="水">
                <div class="img-wrap">
                    <img id="img-玄武" src="" alt="玄武" />
                </div>
                <div class="char-label">玄武</div>
                <div class="char-sub">屬水</div>
            </div>
        </div>

        <!-- 資訊面板 -->
        <div class="info-panel" id="infoPanel">
            <div class="empty-msg">✦ 點擊已選中的靈獸查看詳細技能</div>
        </div>
    </div>

        // ════════════════════════════════════════════════════════════════

        // ─── DOM 參考 ────────────────────────────────────────────────
        const grid = document.getElementById('gridContainer');
        const cards = grid.querySelectorAll('.char-card');
        const statusBar = document.getElementById('statusBar');
        const infoPanel = document.getElementById('infoPanel');
        const btnNewRound = document.getElementById('btnNewRound');

        // 設定圖片來源
        document.getElementById('img-祖龍').src = IMG_祖龍;
        document.getElementById('img-青龍').src = IMG_青龍;
        document.getElementById('img-白虎').src = IMG_白虎;
        document.getElementById('img-朱雀').src = IMG_朱雀;
        document.getElementById('img-玄武').src = IMG_玄武;

        // ─── 角色資料 ──────────────────────────────────────────────
        const CHAR_DATA = {
            '祖龍': {
                name: '祖龍',
                element: '土',
                skillName: '河图',
                defaultDesc: '其他角色的回合开始时，你可以进行一次判定，其本回合不能使用或打出相同颜色的牌。',
                shengDesc: '其他角色的回合开始时，你可以进行一次判定，直至其下回合开始时，不能使用或打出相同颜色的牌。',
                keDesc: '你的回合开始时，你可以进行一次判定，本回合其他角色不能使用或打出相同颜色的牌。',
                shengTrigger: '白虎',
                keTrigger: '青龍',
            },
            '青龍': {
                name: '青龍',
                element: '木',
                skillName: '春雨',
                defaultDesc: '你的回合结束时，你可以选择一名角色并弃置其所有手牌。',
                shengDesc: '你的回合结束时，你可以令任意名其他角色弃置其区域内所有牌。',
                keDesc: '强令：令一名角色于你回合结束时交给你X张手牌。失败：其失去一点体力。 （X为你的体力值）',
                shengTrigger: '朱雀',
                keTrigger: '白虎',
            },
            '白虎': {
                name: '白虎',
                element: '金',
                skillName: '威武',
                defaultDesc: '当你使用的伤害类牌被其他角色抵销时，你可令其选择一项：1. 受到你造成的一点伤害；2. 本回合你对其造成的下一次伤害的伤害值+2。',
                shengDesc: '每回合对每名角色限一次，当你使用伤害类牌时，若此牌被其他角色抵销，你令其受到一点伤害。否则你令此牌的伤害值+1。',
                keDesc: '当你使用的伤害类牌被其他角色抵销时，你可获得目标角色的一张牌。',
                shengTrigger: '玄武',
                keTrigger: '朱雀',
            },
            '朱雀': {
                name: '朱雀',
                element: '火',
                skillName: '覆火',
                defaultDesc: '防止你受到的属性伤害；\n出牌阶段限一次，你可以令所有其他角色依次选择一项：1. 弃置至少X张牌（X为该角色的上家以此法弃置牌的数量+1）；2. 受到你造成的2点火焰伤害。',
                shengDesc: '防止你受到的属性伤害；出牌阶段限一次，你可以令任意名其他角色依次选择一项：1. 弃置至少X张手牌和装备区的所有牌（X为以此法弃置最多牌的角色的弃牌数+1）；2. 受到你造成的1点火焰伤害并将武将牌翻面。',
                keDesc: '防止你受到的属性伤害；每回合限一次，当场上一名角色造成伤害时，你可将其改为火属性伤害。',
                shengTrigger: '祖龍',
                keTrigger: '玄武',
            },
            '玄武': {
                name: '玄武',
                element: '水',
                skillName: '天寿',
                defaultDesc: '当你受到一点伤害时，你可以进行一次判定，若结果为：红色，你回复1点体力；黑色，你摸一张牌。',
                shengDesc: '当你受到伤害或失去体力时，你防止之。',
                keDesc: '当其他角色回复体力时，你可进行一次判定，若结果为红色，你回复一点体力。',
                shengTrigger: '青龍',
                keTrigger: '祖龍',
            },
        };

        // ─── 狀態 ────────────────────────────────────────────────────
        let selected = [];          // 當前被選中的兩個角色名稱
        let isReady = false;        // true 表示已隨機選出兩個，可查看技能

        // ─── 輔助函式 ──────────────────────────────────────────────

        /** 重置所有卡片為 dimmed（變暗、不可點擊） */
        function resetAllDimmed() {
            cards.forEach(c => {
                c.classList.remove('selected', 'dimmed');
                c.classList.add('dimmed');
            });
        }

        /** 更新卡片視覺：給 selected 加亮，其餘 dimmed */
        function updateCardVisuals() {
            cards.forEach(c => {
                const name = c.dataset.char;
                c.classList.remove('selected', 'dimmed');
                if (selected.includes(name)) {
                    c.classList.add('selected');
                } else {
                    c.classList.add('dimmed');
                }
            });
        }

        /** 取得技能描述 (根據另一個選中的角色) */
        function getSkillDesc(charName, otherSelected) {
            const data = CHAR_DATA[charName];
            if (!data) return '';
            if (otherSelected === data.shengTrigger) return data.shengDesc;
            if (otherSelected === data.keTrigger) return data.keDesc;
            return data.defaultDesc;
        }

        function getSkillTag(charName, otherSelected) {
            const data = CHAR_DATA[charName];
            if (!data) return '';
            if (otherSelected === data.shengTrigger) return '相生';
            if (otherSelected === data.keTrigger) return '相克';
            return '無修改';
        }

        /** 顯示角色資訊 */
        function showCharacterInfo(charName) {
            const data = CHAR_DATA[charName];
            if (!data) return;
            const other = selected.find(name => name !== charName) || null;
            const desc = getSkillDesc(charName, other);
            const tag = getSkillTag(charName, other);
            let tagClass = tag === '相生' ? 'shengsheng' : tag === '相克' ? 'xiangke' : '';
            const elemMap = { '土': '🟫', '木': '🟩', '金': '⬜', '火': '🟥', '水': '🟦' };
            const elemIcon = elemMap[data.element] || '';
            let html = `
                <div>
                    <span class="char-name">${data.name}</span>
                    <span class="char-element">${elemIcon} 屬${data.element}</span>
                </div>
                <div class="skill-name">✦ ${data.skillName}</div>
                <div class="skill-desc">${desc.replace(/\n/g, '<br>')}</div>
                <span class="skill-tag ${tagClass}">${tag}</span>
            `;
            infoPanel.innerHTML = html;
        }

        function showEmptyInfo(msg) {
            infoPanel.innerHTML = `<div class="empty-msg">${msg || '✦ 點擊已選中的靈獸查看詳細技能'}</div>`;
        }

        function updateStatus() {
            if (!isReady) {
                statusBar.innerHTML = `✦ 點擊 <span class="highlight">「進入新回合」</span> 隨機選取兩位靈獸`;
            } else {
                statusBar.innerHTML = `✦ 已選定：<span class="highlight">${selected.join('、')}</span>  ·  點擊靈獸查看技能`;
            }
        }

        /** 隨機選取兩個不同角色 */
        function randomSelectTwo() {
            const allNames = ['祖龍', '青龍', '白虎', '朱雀', '玄武'];
            // 洗牌取前兩個
            const shuffled = [...allNames].sort(() => Math.random() - 0.5);
            const picked = shuffled.slice(0, 2);
            selected = picked;
            isReady = true;
            updateCardVisuals();
            // 顯示第一個角色的資訊
            showCharacterInfo(selected[0]);
            updateStatus();
        }

        // ─── 卡片點擊處理 ──────────────────────────────────────────

        function handleCardClick(e) {
            const card = e.currentTarget;
            const charName = card.dataset.char;

            // 如果卡片是 dimmed，忽略點擊
            if (card.classList.contains('dimmed')) return;

            // 否則一定是 selected 的卡片，顯示其資訊
            if (selected.includes(charName)) {
                showCharacterInfo(charName);
            }
        }

        // ─── 綁定事件 ──────────────────────────────────────────────

        cards.forEach(card => {
            card.addEventListener('click', handleCardClick);
        });

        btnNewRound.addEventListener('click', function() {
            randomSelectTwo();
        });

        // ─── 初始化 ──────────────────────────────────────────────────

        // 一開始全部 dimmed
        resetAllDimmed();
        showEmptyInfo('✦ 點擊「進入新回合」開始');
        updateStatus();
        isReady = false;
        selected = [];
    </script>
