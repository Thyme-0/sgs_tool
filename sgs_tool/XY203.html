<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三國殺 · 卡牌</title>
    <style>
        /* ----- reset & base ----- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a2a1f;
            background-image:
                radial-gradient(ellipse at 30% 20%, #2d4a2a 0%, #0f1a0d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.2rem 1rem 2rem;
            font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            overflow-y: auto;
        }

        .app {
            max-width: 1100px;
            width: 100%;
        }

        /* ----- header ----- */
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid rgba(218, 165, 32, 0.3);
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #e8d5a3;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(218, 165, 32, 0.15);
            letter-spacing: 4px;
        }
        .header h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #b8a87a;
            letter-spacing: 2px;
            margin-left: 8px;
        }
        .header .sub {
            color: #a8b89a;
            font-size: 0.8rem;
            margin-top: 2px;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        /* ----- section ----- */
        .section {
            margin-bottom: 1.2rem;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.7rem;
            padding-left: 2px;
        }
        .section-title h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e8d5a3;
            letter-spacing: 2px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
        }
        .section-title .badge {
            font-size: 0.6rem;
            background: rgba(218, 165, 32, 0.2);
            color: #d4c088;
            padding: 1px 12px;
            border-radius: 20px;
            border: 1px solid rgba(218, 165, 32, 0.25);
            letter-spacing: 1px;
        }
        .section-title .count {
            margin-left: auto;
            font-size: 0.7rem;
            color: #b8a87a;
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ----- card grid ----- */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            justify-content: center;
            /* 👈 center the entire row of cards */
            padding: 2px 0;
        }
        .card-grid.tactic-grid {
            gap: 10px 12px;
            justify-content: center;
        }

        /* ----- individual card (smaller size) ----- */
        .card {
            width: 105px;
            height: 147px;
            min-width: 80px;
            min-height: 112px;
            flex-shrink: 0;
            border-radius: 10px;
            background: linear-gradient(145deg, #f7f1e0, #e8dec8);
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: default;
            border: 2px solid rgba(180, 160, 120, 0.3);
            padding: 4px;
            user-select: none;
        }

        /* card inner decoration */
        .card::before {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 6px;
            border: 1px solid rgba(160, 140, 100, 0.2);
            pointer-events: none;
        }

        .card .card-name {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 1px;
            z-index: 1;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
            transition: color 0.3s;
            text-align: center;
            /* 👈 centre the text */
            width: 100%;
            padding: 0 2px;
        }
        .card .card-type {
            font-size: 0.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #8a7a62;
            margin-top: 2px;
            z-index: 1;
            background: rgba(0, 0, 0, 0.04);
            padding: 1px 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            text-align: center;
            /* 👈 centre the text */
        }
        .card .card-sub {
            position: absolute;
            bottom: 6px;
            right: 10px;
            font-size: 0.4rem;
            color: #b8a888;
            letter-spacing: 1px;
            opacity: 0.4;
            font-weight: 300;
        }

        /* ----- card variants ----- */
        .card.basic {
            border-color: rgba(180, 60, 50, 0.5);
        }
        .card.basic .card-name {
            color: #a03528;
        }
        .card.basic::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 4px;
            background: radial-gradient(ellipse at 50% 30%, rgba(200, 80, 60, 0.06), transparent 70%);
            pointer-events: none;
        }

        .card.tactic {
            border-color: rgba(40, 100, 160, 0.5);
        }
        .card.tactic .card-name {
            color: #1a5a8a;
        }
        .card.tactic::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 4px;
            background: radial-gradient(ellipse at 50% 30%, rgba(40, 120, 200, 0.06), transparent 70%);
            pointer-events: none;
        }

        /* ----- selected (highlighted) ----- */
        .card.selected {
            border-color: #f0c850 !important;
            box-shadow:
                0 0 16px rgba(240, 200, 80, 0.45),
                0 4px 20px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(240, 200, 80, 0.08);
            transform: scale(1.03);
            z-index: 2;
        }
        .card.selected .card-name {
            color: #b8860b !important;
            text-shadow: 0 0 20px rgba(240, 200, 80, 0.2);
        }
        .card.selected::before {
            border-color: rgba(240, 200, 80, 0.5);
            box-shadow: inset 0 0 20px rgba(240, 200, 80, 0.05);
        }

        /* ----- dimmed (not selected) ----- */
        .card.dimmed {
            opacity: 0.25;
            filter: grayscale(0.7) brightness(0.7);
            transform: scale(0.95);
            border-color: rgba(120, 110, 90, 0.2) !important;
        }
        .card.dimmed .card-name {
            color: #6a6a6a !important;
        }
        .card.dimmed::after {
            opacity: 0.3;
        }

        /* ----- random-highlight (for the "random pick" buttons) ----- */
        .card.random-highlight {
            border-color: #ff6b35 !important;
            box-shadow:
                0 0 25px rgba(255, 107, 53, 0.6),
                0 4px 20px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(255, 107, 53, 0.12);
            transform: scale(1.06) rotate(-1deg);
            z-index: 5;
            animation: pulse-glow 0.7s ease-in-out 2;
        }
        .card.random-highlight .card-name {
            color: #d44c1a !important;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.3);
        }
        .card.random-highlight::before {
            border-color: rgba(255, 107, 53, 0.6);
        }

        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 25px rgba(255, 107, 53, 0.6), 0 4px 20px rgba(0, 0, 0, 0.5);
            }
            50% {
                box-shadow: 0 0 45px rgba(255, 107, 53, 0.85), 0 4px 24px rgba(0, 0, 0, 0.5);
            }
        }

        /* ----- controls ----- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 18px;
            margin-top: 0.8rem;
            padding: 0.9rem 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            border: 1px solid rgba(218, 165, 32, 0.15);
            backdrop-filter: blur(4px);
        }
        .controls .btn {
            padding: 6px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .controls .btn:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background: linear-gradient(145deg, #5a4a3a, #3d3228);
            color: #e8d5a3;
            border: 1px solid rgba(218, 165, 32, 0.3);
        }
        .btn-reset:hover {
            background: linear-gradient(145deg, #6d5a46, #4a3d30);
            box-shadow: 0 4px 20px rgba(218, 165, 32, 0.2);
            transform: translateY(-2px);
        }

        .btn-basic {
            background: linear-gradient(145deg, #8a3a2e, #602a20);
            color: #f5e6d0;
            border: 1px solid rgba(200, 80, 60, 0.4);
        }
        .btn-basic:hover {
            background: linear-gradient(145deg, #a04536, #703228);
            box-shadow: 0 4px 20px rgba(200, 80, 60, 0.3);
            transform: translateY(-2px);
        }

        .btn-tactic {
            background: linear-gradient(145deg, #1a5a8a, #0e3a5a);
            color: #d0e4f5;
            border: 1px solid rgba(40, 120, 200, 0.4);
        }
        .btn-tactic:hover {
            background: linear-gradient(145deg, #1f6ea8, #124470);
            box-shadow: 0 4px 20px rgba(40, 120, 200, 0.3);
            transform: translateY(-2px);
        }

        .btn .icon {
            font-size: 1rem;
        }

        /* ----- modal (popup) ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fade-in 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }

        @keyframes fade-in {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-box {
            background: rgba(30, 26, 20, 0.92);
            border-radius: 24px;
            padding: 28px 32px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(218, 165, 32, 0.25);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            position: relative;
            pointer-events: auto;
        }
        .modal-box .modal-title {
            color: #d4c088;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-bottom: 14px;
            font-weight: 400;
            text-align: center;
        }
        .modal-box .modal-card {
            width: 160px;
            height: 224px;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: linear-gradient(145deg, #f7f1e0, #e8dec8);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(218, 165, 32, 0.4);
            padding: 8px;
            position: relative;
        }
        .modal-box .modal-card .m-name {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.3);
            text-align: center;
            /* 👈 centre the text */
            width: 100%;
        }
        .modal-box .modal-card .m-type {
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: #8a7a62;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            text-align: center;
            /* 👈 centre the text */
        }
        .modal-box .modal-card .m-sub {
            position: absolute;
            bottom: 10px;
            right: 14px;
            font-size: 0.5rem;
            color: #b8a888;
            opacity: 0.5;
            letter-spacing: 1px;
        }
        .modal-box .modal-card.basic-modal .m-name {
            color: #a03528;
        }
        .modal-box .modal-card.basic-modal {
            border-color: rgba(180, 60, 50, 0.6);
        }
        .modal-box .modal-card.tactic-modal .m-name {
            color: #1a5a8a;
        }
        .modal-box .modal-card.tactic-modal {
            border-color: rgba(40, 100, 160, 0.6);
        }

        .modal-box .btn-close-modal {
            background: rgba(255, 255, 255, 0.06);
            color: #c8b898;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 32px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 2px;
            margin-top: 2px;
            display: inline-block;
        }
        .modal-box .btn-close-modal:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #e8d5a3;
        }

        /* ----- responsive tweaks ----- */
        @media (max-width: 700px) {
            .card {
                width: 85px;
                height: 119px;
                min-width: 70px;
                min-height: 98px;
            }
            .card .card-name {
                font-size: 1.2rem;
            }
            .card .card-type {
                font-size: 0.4rem;
                padding: 0 6px;
            }
            .card-grid {
                gap: 8px 10px;
                justify-content: center;
            }
            .card-grid.tactic-grid {
                gap: 8px 10px;
                justify-content: center;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .controls {
                padding: 0.7rem 1rem;
                gap: 10px 14px;
            }
            .controls .btn {
                padding: 5px 14px;
                font-size: 0.75rem;
            }
            .modal-box .modal-card {
                width: 130px;
                height: 182px;
            }
            .modal-box .modal-card .m-name {
                font-size: 2rem;
            }
            .modal-box {
                padding: 20px 18px 24px;
            }
            .section-title h2 {
                font-size: 1rem;
            }
            .section-title .badge {
                font-size: 0.5rem;
                padding: 0 8px;
            }
            .section-title .count {
                font-size: 0.6rem;
                padding: 1px 10px;
            }
        }

        @media (max-width: 480px) {
            .card {
                width: 72px;
                height: 101px;
                min-width: 60px;
                min-height: 84px;
            }
            .card .card-name {
                font-size: 1rem;
            }
            .card .card-type {
                font-size: 0.35rem;
            }
            .card-grid {
                gap: 6px 8px;
                justify-content: center;
            }
            .card-grid.tactic-grid {
                gap: 6px 8px;
                justify-content: center;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .header h1 small {
                font-size: 0.6rem;
                display: block;
                margin-left: 0;
            }
            .controls .btn {
                padding: 4px 10px;
                font-size: 0.65rem;
                letter-spacing: 0.5px;
            }
            .modal-box .modal-card {
                width: 110px;
                height: 154px;
            }
            .modal-box .modal-card .m-name {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- header -->
        <header class="header">
            <h1>
                三國殺
                <small>· 卡牌</small>
            </h1>
            <div class="sub">⚔️ 基本牌 · 錦囊牌</div>
        </header>

        <!-- 基本牌 section -->
        <section class="section" id="basic-section">
            <div class="section-title">
                <h2>🟥 基本牌</h2>
                <span class="badge">基礎</span>
                <span class="count" id="basic-count">選取 0 / 2</span>
            </div>
            <div class="card-grid" id="basic-grid"></div>
        </section>

        <!-- 錦囊牌 section -->
        <section class="section" id="tactic-section">
            <div class="section-title">
                <h2>🟦 錦囊牌</h2>
                <span class="badge">策略</span>
                <span class="count" id="tactic-count">選取 0 / 8</span>
            </div>
            <div class="card-grid tactic-grid" id="tactic-grid"></div>
        </section>

        <!-- controls -->
        <div class="controls">
            <button class="btn btn-reset" id="resetBtn">
                <span class="icon">⟳</span> 重洗
            </button>
            <button class="btn btn-basic" id="randomBasicBtn">
                <span class="icon">🎲</span> 隨機 · 基本牌
            </button>
            <button class="btn btn-tactic" id="randomTacticBtn">
                <span class="icon">🎲</span> 隨機 · 錦囊牌
            </button>
        </div>

        <!-- modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box">
                <div class="modal-title" id="modalTitle">✦ 隨機抽選 ✦</div>
                <div class="modal-card" id="modalCard">
                    <span class="m-name" id="modalName">殺</span>
                    <span class="m-type" id="modalType">基本牌</span>
                    <span class="m-sub">⚔</span>
                </div>
                <button class="btn-close-modal" id="modalCloseBtn">確 認</button>
            </div>
        </div>

    </div>

    <script>
        // ----- data -----
        const BASIC_CARDS = [
            { id: 'sha', name: '殺', type: 'basic', label: '基本牌' },
            { id: 'shan', name: '閃', type: 'basic', label: '基本牌' },
            { id: 'tao', name: '桃', type: 'basic', label: '基本牌' },
            { id: 'jiu', name: '酒', type: 'basic', label: '基本牌' },
        ];

        const TACTIC_CARDS = [
            { id: 'juedou', name: '決鬥', type: 'tactic', label: '錦囊牌' },
            { id: 'jiedao', name: '借刀殺人', type: 'tactic', label: '錦囊牌' },
            { id: 'wanjian', name: '萬箭齊發', type: 'tactic', label: '錦囊牌' },
            { id: 'nanman', name: '南蠻入侵', type: 'tactic', label: '錦囊牌' },
            { id: 'guohe', name: '過河拆橋', type: 'tactic', label: '錦囊牌' },
            { id: 'shunshou', name: '順手牽羊', type: 'tactic', label: '錦囊牌' },
            { id: 'wuzhong', name: '無中生有', type: 'tactic', label: '錦囊牌' },
            { id: 'wugu', name: '五穀豐登', type: 'tactic', label: '錦囊牌' },
            { id: 'taoyuan', name: '桃園結義', type: 'tactic', label: '錦囊牌' },
            { id: 'wuxie', name: '無懈可擊', type: 'tactic', label: '錦囊牌' },
            { id: 'huogong', name: '火攻', type: 'tactic', label: '錦囊牌' },
            { id: 'tiesuo', name: '鐵索連環', type: 'tactic', label: '錦囊牌' },
            { id: 'lebusi', name: '樂不思蜀', type: 'tactic', label: '錦囊牌' },
            { id: 'bingliang', name: '冰糧寸斷', type: 'tactic', label: '錦囊牌' },
            { id: 'shandian', name: '閃電', type: 'tactic', label: '錦囊牌' },
        ];

        // ----- state -----
        let selectedBasicIds = new Set();
        let selectedTacticIds = new Set();

        // ----- DOM refs -----
        const basicGrid = document.getElementById('basic-grid');
        const tacticGrid = document.getElementById('tactic-grid');
        const basicCount = document.getElementById('basic-count');
        const tacticCount = document.getElementById('tactic-count');
        const resetBtn = document.getElementById('resetBtn');
        const randomBasicBtn = document.getElementById('randomBasicBtn');
        const randomTacticBtn = document.getElementById('randomTacticBtn');

        // modal
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalTitle = document.getElementById('modalTitle');
        const modalCard = document.getElementById('modalCard');
        const modalName = document.getElementById('modalName');
        const modalType = document.getElementById('modalType');

        // ----- helpers -----
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function pickRandom(arr, n) {
            const shuffled = shuffle([...arr]);
            return shuffled.slice(0, n);
        }

        // ----- render cards -----
        function renderCards() {
            basicGrid.innerHTML = '';
            BASIC_CARDS.forEach(card => {
                const el = createCardElement(card, 'basic');
                basicGrid.appendChild(el);
            });

            tacticGrid.innerHTML = '';
            TACTIC_CARDS.forEach(card => {
                const el = createCardElement(card, 'tactic');
                tacticGrid.appendChild(el);
            });

            updateCounts();
        }

        function createCardElement(card, category) {
            const div = document.createElement('div');
            div.className = `card ${category}`;
            div.dataset.id = card.id;
            div.dataset.type = card.type;

            const isSelected = (card.type === 'basic') ?
                selectedBasicIds.has(card.id) :
                selectedTacticIds.has(card.id);

            if (isSelected) {
                div.classList.add('selected');
            } else {
                div.classList.add('dimmed');
            }

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            nameSpan.textContent = card.name;

            const typeSpan = document.createElement('span');
            typeSpan.className = 'card-type';
            typeSpan.textContent = card.label;

            const subSpan = document.createElement('span');
            subSpan.className = 'card-sub';
            subSpan.textContent = card.type === 'basic' ? '⚔' : '✦';

            div.appendChild(nameSpan);
            div.appendChild(typeSpan);
            div.appendChild(subSpan);

            return div;
        }

        function updateCounts() {
            const basicSelected = BASIC_CARDS.filter(c => selectedBasicIds.has(c.id)).length;
            const tacticSelected = TACTIC_CARDS.filter(c => selectedTacticIds.has(c.id)).length;
            basicCount.textContent = `選取 ${basicSelected} / 2`;
            tacticCount.textContent = `選取 ${tacticSelected} / 8`;
        }

        // ----- update selection (re-render with new selected sets) -----
        function updateSelection() {
            document.querySelectorAll('.card').forEach(el => {
                const id = el.dataset.id;
                const type = el.dataset.type;
                const isSelected = (type === 'basic') ?
                    selectedBasicIds.has(id) :
                    selectedTacticIds.has(id);

                el.classList.remove('selected', 'dimmed', 'random-highlight');
                if (isSelected) {
                    el.classList.add('selected');
                } else {
                    el.classList.add('dimmed');
                }
            });
            updateCounts();
        }

        // ----- random initial selection -----
        function randomInitialSelection() {
            const pickedBasic = pickRandom(BASIC_CARDS, 2);
            const pickedTactic = pickRandom(TACTIC_CARDS, 8);

            selectedBasicIds = new Set(pickedBasic.map(c => c.id));
            selectedTacticIds = new Set(pickedTactic.map(c => c.id));

            updateSelection();
        }

        // ----- reset -----
        function resetSelection() {
            document.querySelectorAll('.card.random-highlight').forEach(el => {
                el.classList.remove('random-highlight');
            });
            randomInitialSelection();
        }

        // ----- random pick (one card from category) with modal -----
        function randomPickFromCategory(category) {
            const cards = (category === 'basic') ? BASIC_CARDS : TACTIC_CARDS;
            const picked = cards[Math.floor(Math.random() * cards.length)];

            const isBasic = category === 'basic';
            modalTitle.textContent = isBasic ? '✦ 隨機 · 基本牌 ✦' : '✦ 隨機 · 錦囊牌 ✦';
            modalName.textContent = picked.name;
            modalType.textContent = picked.label;

            modalCard.className = 'modal-card';
            if (isBasic) {
                modalCard.classList.add('basic-modal');
            } else {
                modalCard.classList.add('tactic-modal');
            }

            modalOverlay.classList.add('active');

            document.querySelectorAll('.card.random-highlight').forEach(el => {
                el.classList.remove('random-highlight');
            });

            const targetEl = document.querySelector(`.card[data-id="${picked.id}"]`);
            if (targetEl) {
                targetEl.classList.add('random-highlight');
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            return picked;
        }

        // ----- close modal (tap anywhere) -----
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.querySelectorAll('.card.random-highlight').forEach(el => {
                el.classList.remove('random-highlight');
            });
        }

        // ----- init -----
        function init() {
            renderCards();
            randomInitialSelection();

            resetBtn.addEventListener('click', resetSelection);

            randomBasicBtn.addEventListener('click', () => {
                randomPickFromCategory('basic');
            });

            randomTacticBtn.addEventListener('click', () => {
                randomPickFromCategory('tactic');
            });

            // Close modal on overlay click (tap anywhere)
            modalOverlay.addEventListener('click', closeModal);

            // Close button logic
            modalCloseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeModal();
            });

            // Keyboard: ESC to close
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        }

        // ----- start -----
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
