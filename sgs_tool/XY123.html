<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>錦囊牌抽卡系統</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: pan-y;
        }
        .app {
            max-width: 1400px;
            width: 100%;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: #16213e;
            padding: 14px 24px;
            border-radius: 16px;
            border: 1px solid #2a3a6a;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7d875, #e8b830);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-controls button {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #2a3a6a;
            color: #eee;
            letter-spacing: 1px;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .header-controls button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
        .header-controls button.primary {
            background: linear-gradient(135deg, #e8b830, #c9920a);
            color: #1a1a2e;
        }
        .header-controls button.primary:hover {
            box-shadow: 0 0 20px rgba(232, 184, 48, 0.3);
        }
        .header-controls button.danger {
            background: #c0392b;
        }
        .header-controls button.info {
            background: #2980b9;
        }
        .mode-toggle {
            display: flex;
            background: #0f1a30;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2a3a6a;
        }
        .mode-toggle button {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #8899bb;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            border-radius: 0;
            letter-spacing: 0.5px;
            touch-action: manipulation;
        }
        .mode-toggle button.active {
            background: #2a3a6a;
            color: #f7d875;
            box-shadow: inset 0 0 10px rgba(247, 216, 117, 0.1);
        }
        .mode-toggle button:first-child {
            border-radius: 10px 0 0 10px;
        }
        .mode-toggle button:last-child {
            border-radius: 0 10px 10px 0;
        }
        .deck-info {
            font-size: 14px;
            color: #8899bb;
            padding: 4px 12px;
            background: #0f1a30;
            border-radius: 8px;
            border: 1px solid #1a2a4a;
            white-space: nowrap;
        }
        .deck-info span {
            color: #f7d875;
            font-weight: 700;
        }

        /* hand area */
        .hand-area {
            background: #0f1a30;
            border-radius: 16px;
            border: 1px solid #1a2a4a;
            padding: 18px 20px 14px;
            min-height: 240px;
            margin-bottom: 16px;
            position: relative;
            transition: all 0.3s;
        }
        .hand-area .hand-label {
            font-size: 13px;
            color: #556688;
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hand-area .hand-label .count {
            color: #8899bb;
            background: #1a2a4a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        .hand-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 180px;
            align-items: flex-start;
            padding: 4px 0;
        }
        .hand-cards.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #445566;
            font-size: 16px;
            letter-spacing: 1px;
            min-height: 160px;
        }

        /* card */
        .card {
            width: 140px;
            min-height: 196px;
            background: linear-gradient(145deg, #f5f0e8, #e8e0d4);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 100, 0.15);
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            flex-shrink: 0;
            color: #1a1a2e;
            touch-action: none;
        }
        .card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }
        .card.selected {
            transform: translateY(-20px) scale(1.04);
            box-shadow: 0 16px 40px rgba(247, 216, 117, 0.3), 0 0 0 2px #f7d875;
        }
        .card .card-name {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            line-height: 1.3;
            padding: 4px 0;
            word-break: break-word;
            max-width: 100%;
        }
        .card .card-pack {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            letter-spacing: 0.5px;
            font-weight: 400;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 6px;
            width: 100%;
        }
        .card .card-version {
            font-size: 10px;
            color: #aa8866;
            margin-top: 2px;
            font-weight: 400;
            background: rgba(0, 0, 0, 0.04);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .card.delay {
            border: 3px solid #e74c3c;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px #e74c3c55;
        }
        .card.delay .card-name {
            color: #c0392b;
        }
        .card.delay::after {
            content: '⏳ 延时';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 10px rgba(231, 76, 60, 0.4);
        }
        .card.force {
            border: 3px solid #9b59b6;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px #9b59b655;
        }
        .card.force .card-name {
            color: #7d3c98;
        }
        .card.force::after {
            content: '⚔ 势力';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #9b59b6;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 10px rgba(155, 89, 182, 0.4);
        }
        .card .special-term {
            color: #2980b9;
            font-weight: 700;
            cursor: help;
            border-bottom: 1px dashed #2980b9;
            transition: all 0.2s;
        }
        .card .special-term:hover {
            background: #2980b9;
            color: #fff;
            border-radius: 4px;
            padding: 0 4px;
        }

        /* description panel */
        .desc-panel {
            background: #0f1a30;
            border-radius: 12px;
            border: 1px solid #1a2a4a;
            padding: 14px 20px;
            margin-bottom: 16px;
            min-height: 70px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }
        .desc-panel .empty {
            color: #445566;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .desc-panel .desc-content {
            width: 100%;
        }
        .desc-panel .desc-content .dname {
            font-size: 18px;
            font-weight: 700;
            color: #f7d875;
            margin-right: 12px;
        }
        .desc-panel .desc-content .dpack {
            font-size: 13px;
            color: #8899bb;
        }
        .desc-panel .desc-content .dtext {
            margin-top: 6px;
            font-size: 15px;
            line-height: 1.7;
            color: #dde;
        }
        .desc-panel .desc-content .dtext .special-term {
            color: #5dade2;
            font-weight: 600;
            cursor: help;
            border-bottom: 1px dashed #5dade2;
        }
        .desc-panel .desc-content .dtext .special-term:hover {
            background: #5dade2;
            color: #1a1a2e;
            border-radius: 4px;
            padding: 0 4px;
        }

        /* discard area */
        .discard-area {
            background: #0f1a30;
            border-radius: 16px;
            border: 2px dashed #2a3a6a;
            padding: 14px 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            margin-bottom: 16px;
            color: #445566;
            font-size: 14px;
            letter-spacing: 1px;
            position: relative;
            touch-action: none;
        }
        .discard-area.drag-over {
            border-color: #e74c3c;
            background: #1a0f1a;
            box-shadow: inset 0 0 30px rgba(231, 76, 60, 0.05);
        }
        .discard-area .discard-label {
            position: absolute;
            top: 6px;
            left: 16px;
            font-size: 12px;
            color: #445566;
            letter-spacing: 2px;
        }
        .discard-area .discard-count {
            font-size: 13px;
            color: #8899bb;
            background: #1a2a4a;
            padding: 2px 14px;
            border-radius: 20px;
        }

        /* modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1a1a2e;
            border-radius: 20px;
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a3a6a;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.3s;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #1a2a4a;
            flex-shrink: 0;
        }
        .modal-header h2 {
            font-size: 20px;
            color: #f7d875;
            letter-spacing: 2px;
        }
        .modal-header .close-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1;
            padding: 0 8px;
        }
        .modal-header .close-btn:hover {
            color: #fff;
            transform: rotate(90deg);
        }
        .modal-body {
            padding: 20px 24px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: #0f1a30;
            border-radius: 10px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #2a3a6a;
            border-radius: 10px;
        }

        /* encyclopedia */
        .encyclopedia .type-group {
            margin-bottom: 28px;
        }
        .encyclopedia .type-group h3 {
            font-size: 18px;
            color: #f7d875;
            border-bottom: 1px solid #1a2a4a;
            padding-bottom: 8px;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .encyclopedia .pack-group {
            margin-bottom: 18px;
        }
        .encyclopedia .pack-group h4 {
            font-size: 14px;
            color: #8899bb;
            margin-bottom: 10px;
            padding-left: 4px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .encyclopedia .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .encyclopedia .card-grid .mini-card {
            width: 110px;
            background: #0f1a30;
            border: 1px solid #1a2a4a;
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: #dde;
        }
        .encyclopedia .card-grid .mini-card:hover {
            border-color: #f7d875;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .encyclopedia .card-grid .mini-card .mc-name {
            font-weight: 600;
            font-size: 14px;
        }
        .encyclopedia .card-grid .mini-card .mc-pack {
            font-size: 10px;
            color: #667;
            margin-top: 2px;
        }
        .encyclopedia .card-grid .mini-card.delay-mini {
            border-color: #e74c3c;
        }
        .encyclopedia .card-grid .mini-card.delay-mini .mc-name {
            color: #e74c3c;
        }
        .encyclopedia .card-grid .mini-card.force-mini {
            border-color: #9b59b6;
        }
        .encyclopedia .card-grid .mini-card.force-mini .mc-name {
            color: #9b59b6;
        }

        /* tooltip */
        .tooltip-wrap {
            position: relative;
            display: inline-block;
        }
        .tooltip-text {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #0f1a30;
            border: 1px solid #2a3a6a;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 13px;
            color: #dde;
            width: 320px;
            max-width: 90vw;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 200;
            line-height: 1.6;
            text-align: left;
            font-weight: 400;
            pointer-events: none;
        }
        .tooltip-text::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid transparent;
            border-top-color: #2a3a6a;
        }
        .tooltip-wrap:hover .tooltip-text {
            display: block;
        }

        /* animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes cardDraw {
            0% {
                transform: scale(0.5) rotate(-10deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.1) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }
        .card-draw-anim {
            animation: cardDraw 0.4s ease-out;
        }

        /* drag clone */
        .card-dragging {
            position: fixed !important;
            z-index: 999 !important;
            pointer-events: none !important;
            transform: scale(1.05) rotate(2deg) !important;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7) !important;
            opacity: 0.9 !important;
            transition: none !important;
            touch-action: none;
        }
        .card-dragging-original {
            opacity: 0.4 !important;
            transform: scale(0.95) !important;
        }

        /* responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-controls {
                justify-content: center;
            }
            .card {
                width: 110px;
                min-height: 154px;
                padding: 8px 6px;
            }
            .card .card-name {
                font-size: 14px;
            }
            .card .card-pack {
                font-size: 9px;
            }
            .modal {
                max-height: 95vh;
            }
            .modal-body {
                padding: 12px 14px;
            }
            .encyclopedia .card-grid .mini-card {
                width: 90px;
                font-size: 11px;
                padding: 6px 4px;
            }
            .desc-panel .desc-content .dtext {
                font-size: 13px;
            }
            .hand-cards {
                gap: 8px;
            }
            .discard-area {
                min-height: 60px;
            }
            .header h1 {
                font-size: 18px;
                text-align: center;
            }
            .mode-toggle button {
                padding: 6px 12px;
                font-size: 12px;
            }
            .header-controls button {
                font-size: 12px;
                padding: 6px 12px;
            }
            .deck-info {
                font-size: 12px;
            }
        }
        @media (max-width: 480px) {
            .card {
                width: 85px;
                min-height: 119px;
                padding: 6px 4px;
                border-radius: 8px;
            }
            .card .card-name {
                font-size: 11px;
            }
            .card .card-pack {
                font-size: 8px;
                padding-top: 3px;
                margin-top: 2px;
            }
            .card .card-version {
                font-size: 7px;
                padding: 1px 5px;
            }
            .card.delay::after,
            .card.force::after {
                font-size: 7px;
                padding: 1px 6px;
                top: -5px;
                right: -5px;
            }
            .hand-cards {
                gap: 6px;
            }
            .header-controls {
                gap: 6px;
            }
            .desc-panel {
                padding: 10px 14px;
                min-height: 50px;
            }
            .desc-panel .desc-content .dname {
                font-size: 15px;
            }
            .desc-panel .desc-content .dtext {
                font-size: 12px;
                line-height: 1.5;
            }
            .encyclopedia .card-grid .mini-card {
                width: 70px;
                font-size: 10px;
                padding: 4px 3px;
            }
            .encyclopedia .card-grid .mini-card .mc-name {
                font-size: 11px;
            }
            .modal-header h2 {
                font-size: 16px;
            }
            .tooltip-text {
                width: 220px;
                font-size: 11px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- Header -->
        <div class="header">
            <h1>🃏 錦囊牌</h1>
            <div class="header-controls">
                <button class="primary" id="drawBtn">抽取錦囊牌</button>
                <div class="mode-toggle">
                    <button class="active" data-mode="repetitive">重複</button>
                    <button data-mode="nonrepetitive">不重複</button>
                </div>
                <button class="info" id="encyclopediaBtn">📖 圖鑑</button>
                <button class="danger" id="resetBtn">重置</button>
                <span class="deck-info" id="deckInfo">牌堆餘: <span id="deckCount">0</span></span>
            </div>
        </div>

        <!-- Description Panel -->
        <div class="desc-panel" id="descPanel">
            <div class="empty">點擊手牌中的卡牌查看說明</div>
        </div>

        <!-- Hand Area -->
        <div class="hand-area">
            <div class="hand-label">
                <span>✋ 我的手牌</span>
                <span class="count" id="handCount">0 張</span>
            </div>
            <div class="hand-cards empty" id="handContainer">
                <span>尚無手牌，點擊「抽取錦囊牌」</span>
            </div>
        </div>

        <!-- Discard Area -->
        <div class="discard-area" id="discardArea">
            <span class="discard-label">🗑 棄牌區</span>
            <span class="discard-count" id="discardCount">0 張</span>
            <span style="margin-left:12px;color:#556688;">將卡牌拖曳至此棄置</span>
        </div>
    </div>

    <!-- Encyclopedia Modal -->
    <div class="modal-overlay" id="encyclopediaModal">
        <div class="modal">
            <div class="modal-header">
                <h2>📖 錦囊圖鑑</h2>
                <button class="close-btn" id="closeEncyclopedia">✕</button>
            </div>
            <div class="modal-body" id="encyclopediaBody">
                <!-- rendered by JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip for special terms (global) -->
    <div id="globalTooltip" style="display:none;position:fixed;background:#0f1a30;border:1px solid #2a3a6a;border-radius:10px;padding:10px 16px;font-size:13px;color:#dde;max-width:340px;z-index:9999;box-shadow:0 10px 40px rgba(0,0,0,0.6);line-height:1.6;pointer-events:none;"></div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================
        const CARD_DATA = [];

        // Helper to add cards
        function addCards(pack, cards, type = 'normal', versionNote = null) {
            for (const c of cards) {
                let name = c.name;
                let desc = c.desc;
                let specialTerms = c.specialTerms || [];
                CARD_DATA.push({ name, pack, description: desc, type, versionNote, specialTerms });
            }
        }

        // ---- 普通錦囊 ----
        addCards('标准版', [
            { name: '决斗', desc: '出牌阶段，对一名其他角色使用。由该角色开始，其与你轮流打出一张【杀】，然后首先未打出【杀】的角色受到另一名角色造成的1点伤害。' },
            { name: '借刀杀人', desc: '出牌阶段，对一名装备区里有武器牌的其他角色使用。除非该角色对其攻击范围内，由你选择的另一名角色使用一张【杀】，否则其将其装备区里的武器牌交给你。' },

        // Mark all delay and force cards in the data
        // We already added them with type 'delay' or 'force'

        // ============================================================
        //  STATE
        // ============================================================
        let allCards = [...CARD_DATA];
        let deck = [];
        let hand = [];
        let discarded = [];
        let selectedCardIndex = -1;
        let mode = 'repetitive'; // 'repetitive' | 'nonrepetitive'
        let drawnHistory = new Set(); // for non-repetitive: track card indices (by id)

        // We'll assign a unique id to each card entry for tracking
        let cardIdCounter = 0;
        allCards.forEach(c => { c.id = cardIdCounter++; });

        // ============================================================
        //  DOM REFS
        // ============================================================
        const drawBtn = document.getElementById('drawBtn');
        const resetBtn = document.getElementById('resetBtn');
        const encyclopediaBtn = document.getElementById('encyclopediaBtn');
        const deckCountEl = document.getElementById('deckCount');
        const handContainer = document.getElementById('handContainer');
        const handCountEl = document.getElementById('handCount');
        const discardCountEl = document.getElementById('discardCount');
        const descPanel = document.getElementById('descPanel');
        const modalOverlay = document.getElementById('encyclopediaModal');
        const encyclopediaBody = document.getElementById('encyclopediaBody');
        const closeEncyclopediaBtn = document.getElementById('closeEncyclopedia');
        const discardArea = document.getElementById('discardArea');
        const modeBtns = document.querySelectorAll('.mode-toggle button');

        // ============================================================
        //  FUNCTIONS
        // ============================================================

        function resetDeck() {
            if (mode === 'nonrepetitive') {
                // rebuild deck from all cards, excluding those in hand and discarded
                const usedIds = new Set();
                hand.forEach(c => usedIds.add(c.id));
                discarded.forEach(c => usedIds.add(c.id));
                deck = allCards.filter(c => !usedIds.has(c.id));
                drawnHistory = new Set(usedIds);
            } else {
                // repetitive: full deck
                deck = [...allCards];
                drawnHistory = new Set();
            }
            shuffleDeck();
            updateUI();
        }

        function shuffleDeck() {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function drawCard() {
            if (mode === 'nonrepetitive') {
                // check if all cards are drawn
                if (deck.length === 0) {
                    alert('牌堆已空！所有錦囊牌都已抽完。');
                    return;
                }
                if (deck.length === 0) {
                    alert('牌堆已空！');
                    return;
                }
                // draw from deck
                const card = deck.pop();
                hand.push(card);
                drawnHistory.add(card.id);
                // remove from deck if it's there (it should be)
                deck = deck.filter(c => c.id !== card.id);
                updateUI();
                // show description
                showDescription(card);
                // select the new card
                selectCard(hand.length - 1);
                return;
            } else {
                // repetitive mode: draw random from all cards
                if (allCards.length === 0) return;
                const idx = Math.floor(Math.random() * allCards.length);
                const card = { ...allCards[idx] }; // copy
                hand.push(card);
                updateUI();
                showDescription(card);
                selectCard(hand.length - 1);
            }
        }

        function selectCard(index) {
            if (index < 0 || index >= hand.length) {
                selectedCardIndex = -1;
                renderHand();
                return;
            }
            selectedCardIndex = index;
            renderHand();
            const card = hand[index];
            showDescription(card);
        }

        function showDescription(card) {
            if (!card) {
                descPanel.innerHTML = `<div class="empty">點擊手牌中的卡牌查看說明</div>`;
                return;
            }
            let typeLabel = '';
            if (card.type === 'delay') typeLabel = '⏳ 延時錦囊 ';
            else if (card.type === 'force') typeLabel = '⚔ 勢力錦囊 ';
            else typeLabel = '🃏 普通錦囊 ';

            let versionStr = card.versionNote ? ` (${card.versionNote})` : '';

            let descHtml = card.description;
            // highlight special terms
            if (card.specialTerms && card.specialTerms.length > 0) {
                for (const st of card.specialTerms) {
                    const regex = new RegExp(st.term, 'g');
                    descHtml = descHtml.replace(regex, `<span class="special-term" data-term="${st.term}" data-explanation="${st.explanation}">${st.term}</span>`);
                }
            }

            descPanel.innerHTML = `
                <div class="desc-content">
                    <div>
                        <span class="dname">${card.name}</span>
                        <span class="dpack">${typeLabel}· ${card.pack}${versionStr}</span>
                    </div>
                    <div class="dtext">${descHtml.replace(/\n/g, '<br>')}</div>
                </div>
            `;
            // attach tooltip events for special terms
            document.querySelectorAll('.desc-content .special-term').forEach(el => {
                const term = el.dataset.term;
                const expl = el.dataset.explanation;
                el.addEventListener('mouseenter', (e) => {
                    showTooltip(e, term, expl);
                });
                el.addEventListener('mouseleave', hideTooltip);
                el.addEventListener('click', (e) => {
                    showTooltip(e, term, expl);
                    setTimeout(hideTooltip, 3000);
                });
                // touch support for tooltip
                el.addEventListener('touchstart', (e) => {
                    showTooltip(e, term, expl);
                });
                el.addEventListener('touchend', (e) => {
                    setTimeout(hideTooltip, 3000);
                });
            });
        }

        function renderHand() {
            if (hand.length === 0) {
                handContainer.innerHTML = `<span style="color:#445566;font-size:16px;letter-spacing:1px;">尚無手牌，點擊「抽取錦囊牌」</span>`;
                handContainer.classList.add('empty');
                handCountEl.textContent = '0 張';
                return;
            }
            handContainer.classList.remove('empty');
            let html = '';
            hand.forEach((card, idx) => {
                const isSelected = (idx === selectedCardIndex);
                let classes = 'card';
                if (card.type === 'delay') classes += ' delay';
                if (card.type === 'force') classes += ' force';
                if (isSelected) classes += ' selected';
                let versionStr = card.versionNote ? ` <span class="card-version">${card.versionNote}</span>` : '';
                html += `
                    <div class="${classes}" data-index="${idx}" draggable="true">
                        <div class="card-name">${card.name}</div>
                        <div class="card-pack">${card.pack}${versionStr}</div>
                    </div>
                `;
            });
            handContainer.innerHTML = html;
            handCountEl.textContent = `${hand.length} 張`;

            // attach events
            document.querySelectorAll('.hand-cards .card').forEach(el => {
                const idx = parseInt(el.dataset.index);
                // click/tap to select (desktop and mobile)
                el.addEventListener('click', (e) => {
                    // if currently dragging, ignore
                    if (isDragging) return;
                    if (selectedCardIndex === idx) {
                        selectCard(-1);
                    } else {
                        selectCard(idx);
                    }
                });
                // desktop drag
                el.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', String(idx));
                    e.dataTransfer.effectAllowed = 'move';
                    el.style.opacity = '0.5';
                });
                el.addEventListener('dragend', (e) => {
                    el.style.opacity = '1';
                });
                // mobile touch drag - new implementation
                el.addEventListener('touchstart', handleTouchStart, { passive: true });
                el.addEventListener('touchmove', handleTouchMove, { passive: false });
                el.addEventListener('touchend', handleTouchEnd, { passive: true });
                el.addEventListener('touchcancel', handleTouchEnd, { passive: true });
            });
        }

        // ============================================================
        //  TOUCH DRAG LOGIC (mobile) - improved
        // ============================================================
        let dragState = {
            index: -1,
            element: null,
            clone: null,
            startX: 0,
            startY: 0,
            offsetX: 0,
            offsetY: 0,
            isDragging: false, // set to true after threshold
            discardRect: null,
            moved: false,
        };
        let isDragging = false; // global flag

        const DRAG_THRESHOLD = 10; // pixels

        function handleTouchStart(e) {
            const touch = e.touches[0];
            const el = e.currentTarget;
            const idx = parseInt(el.dataset.index);

            // store initial data
            const rect = el.getBoundingClientRect();
            dragState.index = idx;
            dragState.element = el;
            dragState.startX = touch.clientX;
            dragState.startY = touch.clientY;
            dragState.offsetX = touch.clientX - rect.left;
            dragState.offsetY = touch.clientY - rect.top;
            dragState.isDragging = false;
            dragState.moved = false;
            dragState.clone = null;

            // store discard rect
            const discardRect = discardArea.getBoundingClientRect();
            dragState.discardRect = discardRect;
        }

        function handleTouchMove(e) {
            const touch = e.touches[0];
            const el = dragState.element;
            if (!el) return;

            // if not yet dragging, check threshold
            if (!dragState.isDragging) {
                const dx = touch.clientX - dragState.startX;
                const dy = touch.clientY - dragState.startY;
                if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) {
                    // not enough movement, do nothing
                    return;
                }
                // threshold crossed: start drag
                dragState.isDragging = true;
                isDragging = true;
                dragState.moved = true;

                // create clone
                const rect = el.getBoundingClientRect();
                const clone = el.cloneNode(true);
                clone.classList.add('card-dragging');
                clone.style.width = rect.width + 'px';
                clone.style.height = rect.height + 'px';
                clone.style.position = 'fixed';
                clone.style.left = (touch.clientX - dragState.offsetX) + 'px';
                clone.style.top = (touch.clientY - dragState.offsetY) + 'px';
                clone.style.pointerEvents = 'none';
                clone.style.zIndex = 999;
                document.body.appendChild(clone);
                dragState.clone = clone;

                // add class to original
                el.classList.add('card-dragging-original');

                // prevent default to stop scrolling
                e.preventDefault();
            } else {
                // already dragging: update clone position
                if (dragState.clone) {
                    const newX = touch.clientX - dragState.offsetX;
                    const newY = touch.clientY - dragState.offsetY;
                    dragState.clone.style.left = newX + 'px';
                    dragState.clone.style.top = newY + 'px';

                    // check over discard
                    const discardRect = dragState.discardRect;
                    if (discardRect) {
                        const cx = touch.clientX;
                        const cy = touch.clientY;
                        const isOver = (cx >= discardRect.left && cx <= discardRect.right &&
                                        cy >= discardRect.top && cy <= discardRect.bottom);
                        discardArea.classList.toggle('drag-over', isOver);
                    }
                }
                e.preventDefault(); // prevent scrolling while dragging
            }
        }

        function handleTouchEnd(e) {
            // if we were dragging, check if over discard
            const wasDragging = dragState.isDragging;
            let discard = false;
            if (wasDragging && dragState.clone) {
                // get final touch position
                const touch = e.changedTouches[0];
                const rect = dragState.discardRect;
                if (rect) {
                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        discard = true;
                    }
                }
            }

            // cleanup clone
            if (dragState.clone && dragState.clone.parentNode) {
                dragState.clone.parentNode.removeChild(dragState.clone);
            }
            if (dragState.element) {
                dragState.element.classList.remove('card-dragging-original');
            }
            discardArea.classList.remove('drag-over');

            // if discarded, remove card
            if (discard && dragState.index >= 0 && dragState.index < hand.length) {
                discardCard(dragState.index);
            }

            // reset drag state
            dragState.isDragging = false;
            isDragging = false;
            dragState.clone = null;
            dragState.element = null;
            dragState.index = -1;
        }

        // ============================================================
        //  UPDATE UI
        // ============================================================
        function updateUI() {
            deckCountEl.textContent = deck.length;
            renderHand();
            discardCountEl.textContent = `${discarded.length} 張`;
            // update mode buttons
            modeBtns.forEach(btn => {
                const m = btn.dataset.mode;
                btn.classList.toggle('active', m === mode);
            });
        }

        // ---- discard ----
        function discardCard(index) {
            if (index < 0 || index >= hand.length) return;
            const card = hand[index];
            hand.splice(index, 1);
            discarded.push(card);
            if (mode === 'nonrepetitive') {
                drawnHistory.add(card.id);
                // remove from deck if present
                deck = deck.filter(c => c.id !== card.id);
            }
            if (selectedCardIndex === index) selectedCardIndex = -1;
            else if (selectedCardIndex > index) selectedCardIndex--;
            updateUI();
            if (hand.length === 0) {
                descPanel.innerHTML = `<div class="empty">點擊手牌中的卡牌查看說明</div>`;
            } else if (selectedCardIndex >= 0 && selectedCardIndex < hand.length) {
                showDescription(hand[selectedCardIndex]);
            } else {
                selectCard(0);
            }
        }

        // ---- tooltip ----
        let tooltipTimer = null;

        function showTooltip(e, term, explanation) {
            const el = document.getElementById('globalTooltip');
            el.textContent = `「${term}」：${explanation}`;
            el.style.display = 'block';
            const rect = e.target.getBoundingClientRect();
            let left = rect.left + rect.width / 2 - el.offsetWidth / 2;
            let top = rect.top - el.offsetHeight - 10;
            if (top < 10) top = rect.bottom + 10;
            if (left < 10) left = 10;
            if (left + el.offsetWidth > window.innerWidth - 10) left = window.innerWidth - el.offsetWidth - 10;
            el.style.left = left + 'px';
            el.style.top = top + 'px';
            clearTimeout(tooltipTimer);
        }

        function hideTooltip() {
            tooltipTimer = setTimeout(() => {
                document.getElementById('globalTooltip').style.display = 'none';
            }, 150);
        }

        // ---- encyclopedia ----
        function renderEncyclopedia() {
            const types = [
                { key: 'normal', label: '普通錦囊牌', icon: '🃏' },
                { key: 'delay', label: '延時錦囊牌', icon: '⏳' },
                { key: 'force', label: '勢力錦囊', icon: '⚔' },
            ];
            let html = '<div class="encyclopedia">';
            for (const t of types) {
                const cardsOfType = allCards.filter(c => c.type === t.key);
                if (cardsOfType.length === 0) continue;
                // group by pack
                const packMap = {};
                for (const c of cardsOfType) {
                    const key = c.pack + (c.versionNote ? '|' + c.versionNote : '');
                    if (!packMap[key]) packMap[key] = [];
                    packMap[key].push(c);
                }
                html += `<div class="type-group"><h3>${t.icon} ${t.label} (${cardsOfType.length})</h3>`;
                for (const [packKey, cards] of Object.entries(packMap)) {
                    const [packName, version] = packKey.split('|');
                    let versionStr = version ? ` (${version})` : '';
                    html += `<div class="pack-group"><h4>📦 ${packName}${versionStr}</h4><div class="card-grid">`;
                    for (const c of cards) {
                        let cls = 'mini-card';
                        if (c.type === 'delay') cls += ' delay-mini';
                        if (c.type === 'force') cls += ' force-mini';
                        html += `
                            <div class="${cls}" data-id="${c.id}">
                                <div class="mc-name">${c.name}</div>
                                <div class="mc-pack">${c.pack}</div>
                            </div>
                        `;
                    }
                    html += '</div></div>';
                }
                html += '</div>';
            }
            html += '</div>';
            encyclopediaBody.innerHTML = html;

            // attach click to show description
            document.querySelectorAll('.encyclopedia .mini-card').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.id);
                    const card = allCards.find(c => c.id === id);
                    if (card) {
                        showDescription(card);
                        modalOverlay.classList.remove('active');
                        // if card is in hand, select it; else just show desc
                        const idx = hand.findIndex(c => c.id === id);
                        if (idx >= 0) selectCard(idx);
                        else {
                            // show description but don't select
                            // but we already showed it
                        }
                    }
                });
            });
        }

        // ---- mode switch ----
        function switchMode(newMode) {
            if (newMode === mode) return;
            mode = newMode;
            // reset everything
            hand = [];
            discarded = [];
            selectedCardIndex = -1;
            deck = [];
            drawnHistory = new Set();
            descPanel.innerHTML = `<div class="empty">點擊手牌中的卡牌查看說明</div>`;
            if (mode === 'nonrepetitive') {
                deck = [...allCards];
                shuffleDeck();
                drawnHistory = new Set();
            } else {
                deck = [...allCards];
                shuffleDeck();
                drawnHistory = new Set();
            }
            updateUI();
        }

        // ============================================================
        //  EVENT BINDINGS
        // ============================================================

        drawBtn.addEventListener('click', drawCard);

        resetBtn.addEventListener('click', () => {
            if (mode === 'nonrepetitive') {
                // reset: clear hand, discarded, rebuild deck
                hand = [];
                discarded = [];
                selectedCardIndex = -1;
                deck = [...allCards];
                shuffleDeck();
                drawnHistory = new Set();
                descPanel.innerHTML = `<div class="empty">點擊手牌中的卡牌查看說明</div>`;
                updateUI();
            } else {
                // repetitive: just reshuffle deck
                deck = [...allCards];
                shuffleDeck();
                drawnHistory = new Set();
                // keep hand and discarded as is
                updateUI();
            }
        });

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const newMode = btn.dataset.mode;
                switchMode(newMode);
            });
        });

        encyclopediaBtn.addEventListener('click', () => {
            renderEncyclopedia();
            modalOverlay.classList.add('active');
        });

        closeEncyclopediaBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('active');
        });

        // Discard area drop for desktop
        discardArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            discardArea.classList.add('drag-over');
        });
        discardArea.addEventListener('dragleave', (e) => {
            discardArea.classList.remove('drag-over');
        });
        discardArea.addEventListener('drop', (e) => {
            e.preventDefault();
            discardArea.classList.remove('drag-over');
            const idx = parseInt(e.dataTransfer.getData('text/plain'));
            if (!isNaN(idx) && idx >= 0 && idx < hand.length) {
                discardCard(idx);
            }
        });

        // also allow dropping anywhere on the discard area
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => e.preventDefault());

        // keyboard: delete selected
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedCardIndex >= 0 && selectedCardIndex < hand.length) {
                    discardCard(selectedCardIndex);
                }
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        // initial setup: repetitive mode, full deck
        deck = [...allCards];
        shuffleDeck();
        mode = 'repetitive';
        drawnHistory = new Set();
        updateUI();

        // tooltip global hide
        document.addEventListener('click', () => {
            hideTooltip();
        });

        console.log('🃏 錦囊牌系統已啟動！');
        console.log(`📦 共 ${allCards.length} 張錦囊牌`);
    </script>
</body>
</html>
