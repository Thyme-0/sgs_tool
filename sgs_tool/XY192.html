<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>三國殺 · 紧凑无滚动 + 随机重置红牌</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1f4f1f; /* 深绿桌布 */
            font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;  /* 垂直居中保证所有内容在视口内 */
            padding: 0.5rem 0.2rem;
        }

        .controls {
            background: rgba(255, 248, 220, 0.9);
            padding: 0.5rem 1.2rem;
            border-radius: 4rem;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            margin-bottom: 2vh;       /* 相对单位 */
            display: flex;
            gap: 2vw;
            flex-wrap: wrap;
            justify-content: center;
            border: 2px solid #b8860b;
            flex-shrink: 0;
            max-width: 95vw;
        }

        button {
            background: #1e3a1e;
            border: none;
            color: #f5e6d3;
            font-size: clamp(1rem, 2.5vh, 1.8rem);
            font-weight: bold;
            padding: 0.6rem 1.8rem;
            border-radius: 3rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0a1f0a, 0 4px 8px black;
            cursor: pointer;
            transition: 0.1s ease;
            border: 1px solid #c9a74b;
            min-width: 140px;
            white-space: nowrap;
            touch-action: manipulation;
        }

        button:hover {
            background: #2d532d;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0a1f0a, 0 8px 10px black;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0a1f0a, 0 5px 8px black;
        }

        /* 卡片容器：flex换行，使5行正好不溢出 */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 1vh 0.8vw;
            max-width: 95vw;
            margin: 0 auto;
            flex-shrink: 0;
        }

        /* 卡片尺寸基于视口高度，确保5行刚好 */
        .card {
            width: calc(16vh * 2.5 / 3.5);   /* 2.5/3.5 ≈0.7143, 16vh高对应宽约11.43vh */
            height: 16vh;
            background: #f9f3e7;
            border: 0.3vh solid #3e2b1b;
            border-radius: 2vh;
            box-shadow: 0 1vh 1.5vh rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(0.8rem, 2.2vh, 1.5rem);
            font-weight: 700;
            line-height: 1.3;
            color: #2d1e10;
            transition: background 0.2s, border-color 0.2s;
            cursor: pointer;
            padding: 0 0.5vh;
            word-break: keep-all;
            font-family: 'Noto Sans SC', 'PingFang SC', 'KaiTi', serif;
            flex-shrink: 0;
        }

        /* 绿色标记（本回合选中） */
        .card.green {
            background: #b3e6b3;
            border-color: #1e7e1e;
            color: #003300;
        }

        /* 红色标记（之前回合） */
        .card.red {
            background: #f0b3b3;
            border-color: #a13d3d;
            color: #4a0f0f;
            cursor: not-allowed;
        }

        /* 提示条 */
        .hint {
            color: #f0e6c5;
            margin-top: 1.5vh;
            font-size: clamp(0.8rem, 2vh, 1.3rem);
            background: #2c472c;
            padding: 0.3rem 1.5rem;
            border-radius: 3rem;
            border: 1px solid #dbb45c;
            text-shadow: 1px 1px 2px black;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .hint i {
            font-style: normal;
            background: #2b612b;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            margin: 0 0.2rem;
        }

        /* 极窄屏幕微调 */
        @media (max-width: 600px) {
            .card {
                width: calc(14vh * 2.5 / 3.5);
                height: 14vh;
                font-size: 1.8vh;
            }
            .controls {
                gap: 1rem;
            }
            button {
                font-size: 1rem;
                padding: 0.4rem 1rem;
                min-width: 130px;
            }
            .hint {
                white-space: normal;
                text-align: center;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="newRoundBtn">➕ 新回合</button>
        <button id="resetAllBtn">🔄 全部重置</button>
        <button id="resetRandomRedBtn">🎲 随机重置2张锦囊牌
        </button>
    </div>

    <div class="cards-container" id="cardsContainer"></div>

    <div class="hint">
        <i>⚫</i> 点默认 → 绿(本回合) <i>🟢</i> 再点击取消 <i>🔴</i> 红牌锁定 · 新按钮随机将1~2张红牌变回默认
    </div>

    <script>
        (function() {
            const cardNames = [
                '南蠻入侵', '萬箭齊發', '決鬥', '火攻', '鐵索連環',
                '順手牽羊', '過河拆橋', '無中生有', '借刀殺人', '無懈可擊', '五穀豐登', '桃園結義',
                '樂不思蜀', '兵糧寸斷', '閃電'
            ];

            const container = document.getElementById('cardsContainer');

            function buildCards() {
                container.innerHTML = '';
                cardNames.forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.textContent = name;
                    container.appendChild(card);
                });
            }

            function getAllCards() {
                return document.querySelectorAll('.card');
            }

            // 点击处理：只有非红色可切换绿色
            function handleCardClick(e) {
                const card = e.target.closest('.card');
                if (!card) return;
                if (card.classList.contains('red')) return;

                if (card.classList.contains('green')) {
                    card.classList.remove('green');
                } else {
                    card.classList.add('green');
                }
            }

            // 新回合：所有绿色变为红色
            function newRound() {
                const cards = getAllCards();
                cards.forEach(card => {
                    if (card.classList.contains('green')) {
                        card.classList.remove('green');
                        card.classList.add('red');
                    }
                });
            }

            // 全部重置：清除所有绿色和红色
            function resetAll() {
                const cards = getAllCards();
                cards.forEach(card => {
                    card.classList.remove('green', 'red');
                });
            }

            // 随机重置红牌：重置1~2张红色卡牌（如果存在）
            function resetRandomRed() {
                const cards = getAllCards();
                // 收集所有红色卡片
                const redCards = Array.from(cards).filter(card => card.classList.contains('red'));

                if (redCards.length === 0) return; // 没有红色卡牌，什么也不做

                // 确定要重置的数量：1或2, 但不能超过总红牌数
                let resetCount = Math.min(redCards.length, 2);

                // 打乱数组并选取前 resetCount 个
                for (let i = redCards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [redCards[i], redCards[j]] = [redCards[j], redCards[i]];
                }

                const toReset = redCards.slice(0, resetCount);
                toReset.forEach(card => {
                    card.classList.remove('red'); // 移出红色，回到默认状态
                });
            }

            container.addEventListener('click', handleCardClick);

            document.getElementById('newRoundBtn').addEventListener('click', newRound);
            document.getElementById('resetAllBtn').addEventListener('click', resetAll);
            document.getElementById('resetRandomRedBtn').addEventListener('click', resetRandomRed);

            buildCards();

            // 阻止拖动产生的视觉干扰
            document.querySelectorAll('.card').forEach(c => {
                c.addEventListener('dragstart', (e) => e.preventDefault());
            });
        })();
    </script>
</body>
</html>
