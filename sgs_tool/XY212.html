<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三國殺 · 輔助工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d0d1a;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px 16px 10px;
            color: #f0e8d8;
            overflow: hidden; /* prevent body scroll */
        }

        .app {
            max-width: 1200px;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── header ── */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 215, 140, 0.15);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f7d48a, #e8b86a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .sub {
            font-size: 13px;
            color: #b8a890;
            background: rgba(255, 215, 140, 0.08);
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 140, 0.10);
        }

        /* ── controls ── */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            margin-bottom: 8px;
            background: rgba(255, 215, 140, 0.03);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 140, 0.06);
            flex-shrink: 0;
        }

        .controls .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn {
            padding: 4px 14px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            background: #2a2a3e;
            color: #c8bda8;
            border: 1px solid rgba(255, 215, 140, 0.08);
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #c79a5e, #b58444);
            color: #1a1a2e;
            border-color: #dbb07a;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #dbb07a, #c79a5e);
        }

        .btn-danger {
            background: linear-gradient(135deg, #b34a4a, #8f3535);
            color: #f0e8d8;
            border-color: #cc6a6a;
        }
        .btn-danger:hover {
            background: linear-gradient(135deg, #cc6a6a, #b34a4a);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 215, 140, 0.18);
            color: #c8bda8;
        }
        .btn-outline:hover {
            background: rgba(255, 215, 140, 0.06);
            border-color: rgba(255, 215, 140, 0.35);
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 14px;
            margin-left: auto;
            font-size: 13px;
            color: #b8a890;
        }
        .stats span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .stats .num {
            font-weight: 700;
            color: #f0e8d8;
            min-width: 16px;
            text-align: center;
        }
        .stats .num.gold { color: #f7d48a; }
        .stats .num.pin { color: #7fc9f0; }
        .stats .num.mark { color: #f07a7a; }

        /* ── card grid ── */
        .card-grid-wrapper {
            flex: 1;
            overflow: hidden;
            padding: 4px 2px;
            display: flex;
            align-items: flex-start;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 10px;
            width: 100%;
            align-content: start;
        }

        /* ── card: now much smaller ── */
        .card {
            width: 100%;
            aspect-ratio: 5 / 7; /* 2.5 x 3.5 ratio */
            max-width: 120px;
            border-radius: 10px;
            background: #1c1c30;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.60);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px 4px;
            position: relative;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
            border: 2px solid transparent;
            margin: 0 auto;
            min-height: 80px;
        }

        .card .type-tag {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 1px 6px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: #b8a890;
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }

        .card .card-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.2;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.40);
        }

        .card .card-emoji {
            font-size: 20px;
            margin-bottom: 0px;
            pointer-events: none;
            opacity: 0.5;
        }

        .card .hint {
            position: absolute;
            bottom: 4px;
            font-size: 7px;
            color: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .card .pin-badge {
            display: none;
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 14px;
            pointer-events: none;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }
        .card.pinned .pin-badge {
            display: flex;
        }

        .card .mark-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 8px;
            background: rgba(240, 122, 122, 0.06);
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .card .mark-overlay::after {
            content: "✕";
            font-size: 28px;
            font-weight: 300;
            color: rgba(240, 122, 122, 0.50);
            text-shadow: 0 2px 12px rgba(240, 122, 122, 0.20);
        }
        .card.marked .mark-overlay {
            display: flex;
        }

        /* states */
        .card.active {
            background: linear-gradient(145deg, #282845, #1e1e38);
            border-color: rgba(255, 215, 140, 0.30);
            box-shadow: 0 4px 20px rgba(232, 184, 106, 0.10);
        }
        .card.active .card-name {
            color: #f7d48a;
        }
        .card.active .type-tag {
            background: rgba(255, 215, 140, 0.12);
            color: #f7d48a;
            border-color: rgba(255, 215, 140, 0.15);
        }

        .card.inactive {
            opacity: 0.30;
            filter: grayscale(0.70);
            border-color: rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }
        .card.inactive .card-name {
            color: #8888aa;
        }
        .card.inactive:hover {
            opacity: 0.50;
            filter: grayscale(0.40);
            border-color: rgba(255, 215, 140, 0.10);
        }

        .card.pinned {
            background: linear-gradient(145deg, #1a2a3a, #0f1f2f);
            border-color: #7fc9f0;
            box-shadow: 0 4px 20px rgba(127, 201, 240, 0.15), inset 0 0 30px rgba(127, 201, 240, 0.03);
        }
        .card.pinned .card-name {
            color: #9ad8ff;
        }
        .card.pinned .type-tag {
            background: rgba(127, 201, 240, 0.12);
            color: #9ad8ff;
            border-color: rgba(127, 201, 240, 0.15);
        }

        .card.marked {
            border-color: #f07a7a !important;
            box-shadow: 0 0 0 2px rgba(240, 122, 122, 0.25), 0 4px 20px rgba(240, 122, 122, 0.15);
        }

        .card:not(.inactive):not(.pinned):hover {
            border-color: rgba(255, 215, 140, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.70);
        }
        .card.pinned:hover {
            border-color: #9ad8ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(127, 201, 240, 0.15);
        }
        .card.inactive:hover {
            transform: translateY(-1px);
        }

        /* footer */
        .footer {
            margin-top: 6px;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.10);
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255, 215, 140, 0.04);
            padding-top: 6px;
            flex-shrink: 0;
        }

        /* toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: rgba(20, 20, 40, 0.92);
            backdrop-filter: blur(6px);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 140, 0.12);
            color: #e8dcc8;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.70);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .emoji { margin-right: 8px; }

        /* responsive */
        @media (max-width: 700px) {
            .card .card-name { font-size: 14px; }
            .card .type-tag { font-size: 7px; top: 3px; left: 4px; }
            .card .pin-badge { font-size: 12px; top: 3px; right: 4px; }
            .card .hint { font-size: 6px; bottom: 2px; }
            .card .mark-overlay::after { font-size: 20px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
            .header h1 { font-size: 18px; }
            .controls { padding: 4px 8px; }
            .btn { font-size: 11px; padding: 3px 10px; }
            .stats { font-size: 11px; }
        }

        @media (max-width: 480px) {
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 4px; }
            .card .card-name { font-size: 11px; }
            .card .card-emoji { font-size: 14px; }
            .card .type-tag { font-size: 6px; padding: 0 4px; }
            .card .hint { display: none; }
            .header .sub { font-size: 10px; padding: 0 8px; }
            .btn { font-size: 10px; padding: 2px 8px; }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- header -->
        <div class="header">
            <h1>⚔️ 三國殺 · 輔助</h1>
            <span class="sub">🃏 手牌管理</span>
        </div>

        <!-- controls -->
        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-primary" id="resetSelectedBtn">↻ 重置選定</button>
                <button class="btn btn-danger" id="resetAllBtn">⟳ 全部重置</button>
                <button class="btn btn-outline" id="clearMarksBtn">✕ 清除標記</button>
            </div>
            <div class="stats">
                <span>🃏 <span class="num" id="activeCount">0</span></span>
                <span>📌 <span class="num pin" id="pinnedCount">0</span></span>
                <span>✕ <span class="num mark" id="markedCount">0</span></span>
            </div>
        </div>

        <!-- card grid -->
        <div class="card-grid-wrapper">
            <div class="card-grid" id="cardGrid"></div>
        </div>

        <div class="footer">點擊 · 選中牌可標記重置 · 點擊暗牌可釘選 · 釘選牌不受重置影響</div>
    </div>

    <!-- toast -->
    <div class="toast" id="toast"><span class="emoji">📌</span><span class="msg">已釘選</span></div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DATA
        const BASIC = ['殺', '閃', '桃', '酒'];
        const TACTIC = [
            '決鬥', '借刀殺人', '萬箭齊發', '南蠻入侵',
            '過河拆橋', '順手牽羊', '無中生有', '五穀豐登',
            '桃園結義', '無懈可擊', '火攻', '鐵索連環',
            '樂不思蜀', '冰糧寸斷', '閃電'
        ];
        const ALL_CARDS = [...BASIC, ...TACTIC];
        const CARD_TYPES = {};
        BASIC.forEach(n => CARD_TYPES[n] = '基本牌');
        TACTIC.forEach(n => CARD_TYPES[n] = '錦囊牌');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        let activeIndices = [];
        let pinnedIndices = [];
        let markedIndices = [];

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM
        const grid = document.getElementById('cardGrid');
        const resetSelectedBtn = document.getElementById('resetSelectedBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');
        const clearMarksBtn = document.getElementById('clearMarksBtn');
        const activeCountEl = document.getElementById('activeCount');
        const pinnedCountEl = document.getElementById('pinnedCount');
        const markedCountEl = document.getElementById('markedCount');
        const toast = document.getElementById('toast');
        let toastTimer = null;

        function showToast(msg, emoji = '📌') {
            const el = toast;
            el.querySelector('.msg').textContent = msg;
            el.querySelector('.emoji').textContent = emoji;
            el.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HELPERS
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        function pickRandom(arr, n) {
            const shuffled = shuffle(arr);
            return shuffled.slice(0, n);
        }
        function isBasic(name) { return BASIC.includes(name); }
        function getType(name) { return CARD_TYPES[name] || ''; }

        // pick N random cards from ALL_CARDS, optionally ensuring at least one basic
        function pickFromList(n, requireBasic = false) {
            if (n <= 0) return [];
            if (n > ALL_CARDS.length) n = ALL_CARDS.length;

            const used = new Set([...activeIndices, ...pinnedIndices]);
            let pool = ALL_CARDS.map((_, i) => i).filter(i => !used.has(i));

            if (pool.length < n) {
                // fallback: include all
                const fallback = ALL_CARDS.map((_, i) => i);
                const shuffled = shuffle(fallback);
                return shuffled.slice(0, n);
            }

            if (requireBasic) {
                const basicPool = pool.filter(i => isBasic(ALL_CARDS[i]));
                const nonBasicPool = pool.filter(i => !isBasic(ALL_CARDS[i]));

                if (basicPool.length === 0) {
                    // fallback to all cards
                    const allBasic = ALL_CARDS.map((_, i) => i).filter(i => isBasic(ALL_CARDS[i]));
                    const allNonBasic = ALL_CARDS.map((_, i) => i).filter(i => !isBasic(ALL_CARDS[i]));
                    const chosen = [];
                    if (allBasic.length > 0) {
                        const b = pickRandom(allBasic, 1);
                        chosen.push(b[0]);
                    }
                    const remaining = n - chosen.length;
                    const rest = pickRandom([...allBasic, ...allNonBasic].filter(i => !chosen.includes(i)), remaining);
                    return [...chosen, ...rest];
                }

                const chosen = [];
                const b = pickRandom(basicPool, 1);
                chosen.push(b[0]);
                const restPool = pool.filter(i => !chosen.includes(i));
                const rest = pickRandom(restPool, n - 1);
                return [...chosen, ...rest];
            }

            return pickRandom(pool, n);
        }

        function initState() {
            const basicIndices = BASIC.map(name => ALL_CARDS.indexOf(name));
            const shuffledBasic = shuffle(basicIndices);
            const basicIdx = shuffledBasic[0];
            const remaining = ALL_CARDS.map((_, i) => i).filter(i => i !== basicIdx);
            const others = pickRandom(remaining, 4);
            activeIndices = [basicIdx, ...others];
            pinnedIndices = [];
            markedIndices = [];
            render();
        }

        function resetSelected() {
            if (markedIndices.length === 0) {
                showToast('請先標記要重置的牌', '⚠️');
                return;
            }
            if (markedIndices.length === activeIndices.length && activeIndices.length === 5) {
                resetAll();
                return;
            }
            const markSet = new Set(markedIndices);
            const remainingActive = activeIndices.filter(i => !markSet.has(i));
            const newCards = pickFromList(markedIndices.length, false);
            if (newCards.length < markedIndices.length) {
                showToast('卡池不足，請減少釘選數量', '⚠️');
                return;
            }
            activeIndices = [...remainingActive, ...newCards];
            markedIndices = [];
            render();
            showToast(`已重置 ${newCards.length} 張牌`, '↻');
        }

        function resetAll() {
            const pinnedSet = new Set(pinnedIndices);
            const pool = ALL_CARDS.map((_, i) => i).filter(i => !pinnedSet.has(i));
            if (pool.length < 5) {
                showToast('卡池不足，請減少釘選數量', '⚠️');
                return;
            }
            const basicPool = pool.filter(i => isBasic(ALL_CARDS[i]));
            let newActive;
            if (basicPool.length === 0) {
                const allBasic = ALL_CARDS.map((_, i) => i).filter(i => isBasic(ALL_CARDS[i]));
                const b = pickRandom(allBasic, 1);
                const rest = pickRandom(ALL_CARDS.map((_, i) => i).filter(i => i !== b[0]), 4);
                newActive = [b[0], ...rest];
            } else {
                const b = pickRandom(basicPool, 1);
                const restPool = pool.filter(i => i !== b[0]);
                const rest = pickRandom(restPool, 4);
                newActive = [b[0], ...rest];
            }
            activeIndices = newActive;
            markedIndices = [];
            render();
            showToast('全部重置 · 至少一張基本牌', '⟳');
        }

        function toggleMark(index) {
            if (!activeIndices.includes(index)) return;
            const idx = markedIndices.indexOf(index);
            if (idx === -1) markedIndices.push(index);
            else markedIndices.splice(idx, 1);
            render();
        }

        function togglePin(index) {
            if (activeIndices.includes(index)) return;
            const idx = pinnedIndices.indexOf(index);
            if (idx === -1) {
                pinnedIndices.push(index);
                showToast(`已釘選 「${ALL_CARDS[index]}」`, '📌');
            } else {
                pinnedIndices.splice(idx, 1);
                showToast(`已取消釘選 「${ALL_CARDS[index]}」`, '🔓');
            }
            render();
        }

        function clearMarks() {
            if (markedIndices.length === 0) {
                showToast('沒有標記的牌', '✕');
                return;
            }
            markedIndices = [];
            render();
            showToast('已清除所有標記', '✕');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER
        function render() {
            const activeSet = new Set(activeIndices);
            const pinnedSet = new Set(pinnedIndices);
            const markedSet = new Set(markedIndices);

            activeCountEl.textContent = activeIndices.length;
            pinnedCountEl.textContent = pinnedIndices.length;
            markedCountEl.textContent = markedIndices.length;

            let html = '';
            ALL_CARDS.forEach((name, idx) => {
                const isActive = activeSet.has(idx);
                const isPinned = pinnedSet.has(idx);
                const isMarked = markedSet.has(idx);
                const isInactive = !isActive && !isPinned;

                let classes = 'card';
                if (isActive) classes += ' active';
                else if (isInactive) classes += ' inactive';
                else if (isPinned) classes += ' pinned';
                if (isMarked) classes += ' marked';

                const type = getType(name);
                const emoji = isBasic(name) ? '⚔️' : '🌀';
                let hint = '';
                if (isActive) hint = '點擊標記';
                else if (isInactive) hint = '點擊釘選';
                else if (isPinned) hint = '點擊取消';

                html += `
                    <div class="${classes}" data-index="${idx}" data-active="${isActive}" data-inactive="${isInactive}" data-pinned="${isPinned}">
                        <span class="type-tag">${type}</span>
                        <span class="pin-badge">📌</span>
                        <div class="mark-overlay"></div>
                        <div class="card-emoji">${emoji}</div>
                        <div class="card-name">${name}</div>
                        <div class="hint">${hint}</div>
                    </div>
                `;
            });

            grid.innerHTML = html;

            grid.querySelectorAll('.card').forEach(el => {
                el.addEventListener('click', function(e) {
                    const idx = parseInt(this.dataset.index, 10);
                    const isActive = this.dataset.active === 'true';
                    const isInactive = this.dataset.inactive === 'true';
                    const isPinned = this.dataset.pinned === 'true';

                    if (isActive) {
                        toggleMark(idx);
                    } else if (isInactive) {
                        togglePin(idx);
                    } else if (isPinned) {
                        togglePin(idx);
                    }
                });
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        initState();

        resetSelectedBtn.addEventListener('click', resetSelected);
        resetAllBtn.addEventListener('click', resetAll);
        clearMarksBtn.addEventListener('click', clearMarks);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) return;
                resetSelected();
                e.preventDefault();
            }
            if (e.key === 'a' || e.key === 'A') {
                if (e.ctrlKey || e.metaKey) return;
                resetAll();
                e.preventDefault();
            }
            if (e.key === 'c' || e.key === 'C') {
                if (e.ctrlKey || e.metaKey) return;
                clearMarks();
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
